name: APK lataM
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake

      - name: Empaquetar juego.lataM (opcional)
        run: |
          if [ -f juego/principal.lat ]; then
            python3 - <<'PY'
          import zipfile, os
          with zipfile.ZipFile("juego.lataM", "w", zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk("juego"):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, "juego"))
          PY
            echo "juego.lataM creado: se incluira en el APK"
          else
            echo "Sin carpeta juego/: el APK abrira el selector de .lataM"
          fi

      - name: Instalar buildozer
        run: pip install --upgrade buildozer "cython==0.29.33"

      - name: Construir APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: lataM-apk
          path: bin/*.apk
